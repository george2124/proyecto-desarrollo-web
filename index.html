<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Turismo Argentina</title>
<link rel="stylesheet" href="css/styles.css">
<script defer src="js/app.js"></script>
</head>

<body>

<header>
    <h1>Turismo Argentina</h1>

    <nav aria-label="Menú principal">
        <ul>
            <li><a href="index.html">Inicio</a></li>
            <li><a href="destinos.html">Destinos</a></li>
            <li><a href="agencias.html">Agencias</a></li>
            <li><a href="precios.html">Precios</a></li>
            <li><a href="contacto.html">Contacto</a></li>
        </ul>
    </nav>

    <button id="modoBtn">🌙</button>
</header>

<!-- HERO -->
  <!--<h2>Explorá Argentina</h2>
  <p>Experiencias únicas en cada destino</p>-->
<section class="hero">
    <div class="overlay">
        <iframe 
            width="560" 
            height="315" 
            src="https://www.youtube.com/embed/Np7NBOVUtgg?si=yvi4ASnDcCW7kexX" 
            title="YouTube video player" 
            frameborder="0" 
            allow="accelerometer; 
            autoplay; clipboard-write; 
            encrypted-media; gyroscope; 
            picture-in-picture; web-
            share" referrerpolicy="strict-
            origin-when-cross-origin" 
            allowfullscreen>
        </iframe>
    </div>
</section>

<!-- CARDS -->
<main class="cards">
    <article class="card">
        <h3>Bariloche</h3>
            <div class="card-header">
                <img src="img/bariloche2.jpg" width="300" height="200" alt="destino bariloche2">
            </div>
        <p>Lagos y montañas</p>
    </article>

    <article class="card">
        <h3>Iguazú</h3>
          <div class="card-header">
                <img src="img/iguazu.jpg" width="300" height="200" alt="destino iguazu">
            </div>
        <p>Cataratas del mundo</p>
    </article>

    <article class="card">
        <h3>Mendoza</h3>
          <div class="card-header">
                <img src="img/mendoza.jpg" width="300" height="200" alt="destino mendoza">
            </div>
        <p>Vinos y cordillera</p>
    </article>
</main>

<!-- CONTADOR -->
<section class="contador">
    <span id="contador">0</span>
    <p>Viajeros felices</p>
</section>

<!-- TESTIMONIOS -->
<section class="carrusel">
    <div>"Increíble viaje"</div>
    <div>"Todo perfecto"</div>
    <div>"Volvería otra vez"</div>
</section>

<!-- FOOTER -->
<footer>
    <form>
        <input type="email" placeholder="Tu email" required>
        <button>Suscribirse</button>
    </form>

    <iframe 
    src="https://maps.google.com/maps?q=argentina&t=&z=5&output=embed"
    loading="lazy">
    </iframe>

    <p>© 2026 Turismo Argentina</p>
</footer>

</body>
</html>
